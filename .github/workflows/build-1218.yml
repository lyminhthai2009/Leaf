name: Build Leaf Server

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Thêm bước cấu hình Git để sửa lỗi "Committer identity unknown"
      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Apply Patches
        run: ./gradlew applyAllPatches

      - name: Upload Patched Sources for IDE
        uses: actions/upload-artifact@v4
        with:
          name: Patched-Sources-For-IDE
          path: |
            paper-api
            paper-server
            leaf-api
            leaf-server

      - name: Build Server JAR
        run: ./gradlew :leaf-server:paperclip

      - name: Upload Server JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Leaf-Server-JAR
          path: 'leaf-server/build/libs/*-paperclip.jar'
